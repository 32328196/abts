name: Build Unassigned iOS IPA

on:
  workflow_dispatch: # 支持在网页上手动一键触发

jobs:
  build-ios:
    runs-on: macos-latest # 使用 GitHub 免费的云端 Mac 环境

    steps:
      - name: 1. 拉取项目源码
        uses: actions/checkout@v4

      - name: 2. 安装 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: 'stable'

      - name: 3. 自动生成 iOS 工程目录并获取依赖
        run: |
          flutter create --platforms=ios .
          flutter pub get

      - name: 4. 配置 iOS 后台播放与相册权限
        run: |
          # 开启锁屏/后台音频播放权限，防止切出应用后断流
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" ios/Runner/Info.plist
          # 添加保存二维码到相册的权限说明
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 需要相册权限以保存登录二维码" ios/Runner/Info.plist

      - name: 5. 安装 CocoaPods 依赖
        run: |
          cd ios
          pod install
          cd ..

      - name: 6. 编译无签名 iOS 应用 (Runner.app)
        run: |
          flutter build ios --release --no-codesign

      - name: 7. 封装生成 .ipa 安装包
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r abts-ios.ipa Payload

      - name: 8. 上传 IPA 产物供下载
        uses: actions/upload-artifact@v4
        with:
          name: abts-ios-ipa
          path: abts-ios.ipa
